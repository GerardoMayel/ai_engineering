[project]
name = "ai-engineering"
version = "0.1.0"
description = "Bootcamp de AI Engineering: chat de terminal con Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.14.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.13.0",
]

[project.scripts]
ai-engineering = "ai_engineering:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
